# The team's review rules, compiled from the plain-English rules in the spec.
# Every finding the reviewer returns must use one of these ids.
rules:
- id: no-pii-logs
  text: Never write personal data such as emails, names, phone numbers, addresses, tokens, IP addresses or internal user IDs into logs.
  default_severity: block
- id: auth-required
  text: Every FastAPI endpoint needs a login check, except health-check and docs endpoints, and a login check added once for a group of endpoints or for the whole app counts.
  default_severity: block
- id: no-raw-sql
  text: Never build SQL queries by inserting values straight into the SQL text with string formatting or concatenation.
  default_severity: block
- id: no-secrets
  text: Never write secrets such as API keys, passwords or tokens directly in the code.
  default_severity: block
- id: external-call-errors
  text: Flag calls to outside services that do not handle possible failures.
  default_severity: warn
